services:
  db:
    image: postgres:16-alpine
    container_name: antindex-db
    restart: unless-stopped
    env_file: .env
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  crawler:
    build: ./crawler
    container_name: antindex-crawler
    restart: unless-stopped
    command: ["python", "main.py", "loop-crawl-price"]
    environment:
      - DATABASE_URL=postgresql://antindex:antindex2026@db:5432/antindex
    depends_on:
      - db
    # 로그 파일이 무한히 자라거나 부패한 바이트가 영구히 막히는 것을 방지.
    # 10MB 마다 rotate, 최근 3개 파일만 유지 → 최대 ~30MB.
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  analyzer:
    build: ./crawler
    container_name: antindex-analyzer
    restart: unless-stopped
    command: ["python", "main.py", "loop-analyze"]
    # GEMINI_API_KEY 등 LLM 설정은 crawler/.env 에서 로드한다.
    # env_file 내 DATABASE_URL(localhost) 은 아래 environment 가 덮어쓰므로 안전.
    env_file: ./crawler/.env
    environment:
      - DATABASE_URL=postgresql://antindex:antindex2026@db:5432/antindex
      - OLLAMA_URL=http://host.docker.internal:11434
    depends_on:
      - db
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  server:
    build: ./server
    container_name: antindex-server
    restart: unless-stopped
    environment:
      - DATABASE_URL=postgresql://antindex:antindex2026@db:5432/antindex
      - PORT=3333
    ports:
      - "3333:3333"
    depends_on:
      - db
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  web:
    build:
      context: ./web
      args:
        # 브라우저가 호출할 API URL — NEXT_PUBLIC_* 는 빌드 타임 inline 이므로
        # 프로덕션 배포 시 .env 또는 compose override 로 실제 도메인 주입.
        # 기본값(http://localhost:3333/api) 은 로컬 dev compose 용.
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:3333/api}
    container_name: antindex-web
    restart: unless-stopped
    ports:
      - "3030:3030"
    depends_on:
      - server
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  pgdata:
